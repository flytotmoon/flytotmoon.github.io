# ============================================================
# flytotmoon 博客自动构建部署工作流
#
# 用途：为「GitHub 云端后台」提供在线构建能力。
# 当源码分支（默认 source）有推送，或在线后台触发
# workflow_dispatch 时，自动执行 hexo generate 并把构建产物
# 强制推送到 Pages 分支（master，即 flytotmoon.github.io 默认分支）。
#
# 注意：
#   - 本文件需要放在「源码分支」上（与 package.json 同一仓库层级）
#   - master 分支由本工作流自动覆盖，请勿手动编辑其内容
#   - 若 themes/anzhiyu 以 git submodule 方式引入，请保持下面
#     checkout 步骤中的 submodules: 'recursive'
# ============================================================

name: Auto Deploy Blog

on:
  push:
    branches:
      - source # 源码分支（按实际修改）
  workflow_dispatch: # 允许在线后台通过 API 触发

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装 pandoc（hexo-renderer-pandoc 依赖）
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: 安装主题（若 themes/anzhiyu 未随源码提交，作为兜底克隆）
        run: |
          if [ ! -f themes/anzhiyu/package.json ]; then
            echo "themes/anzhiyu 未随源码提交，正在克隆官方主题…"
            git clone --depth 1 https://github.com/anzhiyu-c/hexo-theme-anzhiyu.git themes/anzhiyu
          else
            echo "themes/anzhiyu 已随源码提交"
          fi

      - name: 安装依赖
        run: npm ci || npm install

      - name: 生成静态文件
        run: npx hexo clean && npx hexo generate

      - name: 部署到 Pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: master # Pages 分支（flytotmoon.github.io 的默认分支）
          force_orphan: true
          commit_message: 'auto deploy: ${{ github.event.head_commit.message }}'
          cname: blog.flytotmoon.cn

      # ---- 搜索引擎主动推送（可选）----
      # 百度：在仓库 Settings → Secrets 配置 BAIDU_TOKEN（百度站长平台 → 普通收录 → 推送接口）
      - name: 主动推送 URL 到百度
        if: env.BAIDU_TOKEN != ''
        run: |
          if [ -f public/sitemap_urls.txt ]; then
            echo "推送 $(wc -l < public/sitemap_urls.txt) 个 URL 到百度…"
            curl -s -H 'Content-Type:text/plain' --data-binary @public/sitemap_urls.txt \
              "http://data.zz.baidu.com/urls?site=https://blog.flytotmoon.cn&token=${BAIDU_TOKEN}" || true
          fi

      # Bing/IndexNow：在仓库 Settings → Secrets 配置 INDEXNOW_KEY（任意 8-128 位字符串）
      - name: 通知 IndexNow（Bing/Naver 等）
        if: env.INDEXNOW_KEY != ''
        run: |
          FIRST=$(head -n 1 public/sitemap_urls.txt 2>/dev/null || echo "https://blog.flytotmoon.cn/")
          curl -s "https://api.indexnow.org/indexnow?url=${FIRST}&key=${INDEXNOW_KEY}" || true
